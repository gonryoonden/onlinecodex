name: Personal Magic Studio
on:
  pull_request:
    paths: ['apps/studio/**', 'scripts/studio*', 'scripts/evaluation/**', 'scripts/test-studio-python', 'tests/studio/**', '.github/workflows/studio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STUDIO_LAYER_CORPUS: ${{ github.workspace }}/evidence/studio/layer-corpus
      STUDIO_MASK_EVIDENCE: ${{ github.workspace }}/evidence/studio/mask
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node --test tests/studio/private-proxy.test.mjs tests/studio/deployment-guard.test.mjs
      - run: npm --prefix apps/studio ci
      - run: python -m pip install -r scripts/studio-test-requirements.txt
      - run: python scripts/evaluation/layer-corpus.py "$STUDIO_LAYER_CORPUS"
      - run: npm --prefix apps/studio run typecheck && npm --prefix apps/studio run lint && npm --prefix apps/studio test && npm --prefix apps/studio run build
      - run: python scripts/evaluation/layer-report.py "$STUDIO_LAYER_CORPUS"
      - run: python scripts/verify-browser-pptx.py evidence/studio/native-pptx-smoke.pptx
      - run: python scripts/studio-verify-native.py evidence/studio/native-table.pptx --expect-tables 1 --expect-charts 0
      - run: python scripts/studio-verify-native.py evidence/studio/native-chart.pptx --expect-tables 0 --expect-charts 1
      - run: ./scripts/test-studio-python
      - name: Install test browser
        working-directory: apps/studio
        run: |
          npx playwright install --with-deps chromium
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + require("@playwright/test").chromium.executablePath() + "\n")'
      - name: Browser and artifact verification without AI keys
        run: |
          mkdir -p evidence/studio
          STUDIO_PYTHON="$(command -v python)" npm --prefix apps/studio start > /tmp/studio-server.log 2>&1 &
          npm --prefix apps/studio run test:e2e
          python scripts/verify-studio-artifacts.py
          python scripts/studio-verify-presentation.py evidence/studio/web/presentation.pptx --reference-dir evidence/studio/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-evidence
          path: |
            evidence/studio/
            apps/studio/test-results/
          retention-days: 7
